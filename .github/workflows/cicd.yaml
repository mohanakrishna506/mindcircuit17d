name: Deploy WAR to Tomcat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_deploy_tomcat:
    #runs-on: ubuntu-latest
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the WAR file
        run: mvn clean package

      - name: Deploy WAR to Tomcat
        run: |
          WAR_FILE=$(ls target/*.war | head -n 1)
          APP_NAME=mindcircuit17d

          curl -v \
            -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_HOSTNAME }}:8081/manager/text/deploy?path=/$APP_NAME&update=true"
